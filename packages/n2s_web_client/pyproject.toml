[project]
name = "n2s-web-client"
version = "0.1.0"
description = "HTTP client for noise-to-signal Django /api/internal/* routes"
requires-python = ">=3.12"
dependencies = [
    "n2s-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["n2s_web_client"]

[tool.uv.sources]
n2s-api = { path = "../n2s_api", editable = false }
