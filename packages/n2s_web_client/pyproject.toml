[project]
name = "n2s-web-client"
version = "0.1.0"
description = "HTTP client for noise-to-signal Django /api/internal/* routes"
requires-python = ">=3.12"
dependencies = [
    "n2s-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["n2s_web_client"]

[tool.uv.sources]
n2s-api = { path = "../n2s_api", editable = false }

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"
