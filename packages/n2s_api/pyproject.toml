[project]
name = "n2s-api"
version = "0.1.0"
description = "Shared API contracts for noise-to-signal (web ↔ Lambdas)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["n2s_api"]
