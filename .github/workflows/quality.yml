# PR quality gates — same just recipes as deploy-infra quality job (separate steps).
name: Quality

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "web/**"
      - "lambdas/**"
      - "packages/**"
      - "runner/**"
      - "justfile"
      - ".githooks/**"
      - ".github/workflows/quality.yml"
      - ".github/workflows/deploy-infra.yml"
      - ".github/actions/setup-quality/**"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: n2s
          POSTGRES_PASSWORD: n2s
          POSTGRES_DB: n2s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n2s -d n2s_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://n2s:n2s@localhost:5432/n2s_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup quality
        uses: ./.github/actions/setup-quality

      - name: Format check
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test
