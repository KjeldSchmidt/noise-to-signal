# Deploy via infrastructure/justfile — keep Terraform choreography out of this file.
name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "web/**"
      - "lambdas/**"
      - "packages/**"
      - "runner/**"
      - "justfile"
      - ".github/workflows/deploy-infra.yml"
      - ".github/workflows/deploy-env.yml"
      - ".github/workflows/quality.yml"
      - ".github/actions/setup-infra/**"
      - ".github/actions/setup-quality/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy-shared:
    name: Deploy Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup infra
        uses: ./.github/actions/setup-infra
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check infra format
        working-directory: infrastructure
        run: just fmt-check

      - name: Lint infra
        working-directory: infrastructure
        run: just lint

      - name: Apply shared stack
        working-directory: infrastructure
        run: just apply-shared

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: n2s
          POSTGRES_PASSWORD: n2s
          POSTGRES_DB: n2s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n2s -d n2s_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://n2s:n2s@localhost:5432/n2s_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup quality
        uses: ./.github/actions/setup-quality

      - name: Format check
        run: just fmt-check

      - name: Lint
        run: just lint-check

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test

  deploy-dev:
    name: Deploy Dev
    needs: deploy-shared
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      image_tag: ${{ github.sha }}
      push_images: true
    secrets: inherit

  deploy-prod:
    name: Deploy Prod
    needs: [deploy-dev, quality]
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      image_tag: ${{ github.sha }}
      push_images: false
    secrets: inherit
