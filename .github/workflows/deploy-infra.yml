# Deploy via infrastructure/justfile — keep Terraform choreography out of this file.
name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "web/**"
      - "lambdas/**"
      - "packages/**"
      - ".github/workflows/deploy-infra.yml"
      - ".github/workflows/deploy-env.yml"
      - ".github/actions/setup-infra/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy-shared:
    name: Deploy Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup infra
        uses: ./.github/actions/setup-infra
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check infra format
        working-directory: infrastructure
        run: just fmt-check

      - name: Lint infra
        working-directory: infrastructure
        run: just lint

      - name: Apply shared stack
        working-directory: infrastructure
        run: just apply-shared

  deploy-dev:
    name: Deploy Dev
    needs: deploy-shared
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      image_tag: ${{ github.sha }}
      push_images: true
    secrets: inherit

  deploy-prod:
    name: Deploy Prod
    needs: deploy-dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      image_tag: ${{ github.sha }}
      push_images: false
    secrets: inherit
