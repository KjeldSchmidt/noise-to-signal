[project]
name = "web"
version = "0.1.0"
description = "noise-to-signal news aggregator web UI (Django)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-allauth[socialaccount]>=65.20.1",
    "gunicorn>=26.2.0",
    "mangum>=0.19.0",
    "n2s-api",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[tool.uv.sources]
n2s-api = { path = "../packages/n2s_api", editable = false }

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "django-stubs-ext>=6.1.2",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]
# Grandfather Django decorator/stub friction; new diagnostics still fail CI.
baseline = "ty-baseline.json"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["**/migrations/**"]
