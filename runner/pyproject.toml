[project]
name = "runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[aws]>=1.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mem0ai>=2.0.20",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv before imports; long Field/demo strings are intentional
"main.py" = ["E402"]
"data.py" = ["E501"]
"state.py" = ["E501"]
"evaluate_user_preference.py" = ["E501"]

[tool.ty]
# Prototype LangGraph app — grandfather stub friction; new diagnostics still fail.
baseline = "ty-baseline.json"

[tool.ty.environment]
python-version = "3.13"
