[project]
name = "news_chat"
version = "0.1.0"
description = "noise-to-signal news chat — scope classifier + grounded RAG answers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[aws]>=1.4.0",
    "langsmith>=0.14.9",
    "n2s-api",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
n2s-api = { path = "../../packages/n2s_api", editable = false }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"
